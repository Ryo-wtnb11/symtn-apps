[workspace]
members = ["golden-chain"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ryo-wtnb11/symtn-apps"
publish = false

[workspace.dependencies]
# Pinned by rev: an application must be reproducible against the exact
# symtn it was validated with. Bump in a dedicated commit.
# `krylov` declares LAPACK, so the binary needs a provider; `blas-openblas`
# is symtn's own krylov feature contract (no default `cpu-faer`).
symtn = { git = "https://github.com/Ryo-wtnb11/symtn-rs", rev = "54c3d162e4e751122ad7f35e537b3f8d3ea45ddc", default-features = false, features = ["krylov", "blas-openblas"] }
num-complex = "0.4"
