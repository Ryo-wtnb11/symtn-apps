name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # rust-cache drops target/*/{.fingerprint,build}, so without them cargo
      # rebuilds openblas-src's C library (minutes) on every run; the same
      # layering as symtn's `cargo-build-script-cache` action.
      - uses: actions/cache@v4
        with:
          path: |
            target/*/.fingerprint
            target/*/build
          key: cargo-fp-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-fp-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
